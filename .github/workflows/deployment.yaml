name: Terraform Azure Deployment

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write   # IMPORTANT pour OIDC

jobs:
  terraform:
    runs-on: ubuntu-latest

    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.CLIENT_ID_MONITOR }}
      ARM_TENANT_ID: ${{ secrets.TENANT_ID_MONITOR }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.SUBSCRIPTION_ID_MONITOR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4


      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.CLIENT_ID_MONITOR }}
          tenant-id: ${{ secrets.TENANT_ID_MONITOR }}
          subscription-id: ${{ secrets.SUBSCRIPTION_ID_MONITOR }}


      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: v1.12.0

      - name: Tofu Init
        run: tofu init -upgrade

      - name: Tofu Format
        run: tofu fmt -check -recursive

      - name: Tofu Validate
        run: tofu validate

      - name: Tofu Plan
        run: tofu plan -input=false